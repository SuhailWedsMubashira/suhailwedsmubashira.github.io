<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suhail & Mubashira · Wedding Invitation</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2c2924; --soft:#6b645b; --gold:#b08f55; --line:#ece6dc; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#fff; color:var(--ink); font-family:Jost, system-ui, sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; }
  header { text-align:center; padding:4rem 1.5rem 1rem; }
  header .eyebrow { font-size:.72rem; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); font-weight:400; }
  header h1 { font-family:"Pinyon Script", cursive; font-weight:400; font-size:clamp(2.6rem, 9vw, 4rem); line-height:1.2; margin:.6rem 0 .4rem; }
  section { padding:2rem 0 .5rem; }
  section + section { border-top:1px solid var(--line); }
  section > h2 { text-align:center; font-family:"Cormorant Garamond", serif; font-weight:500; font-size:1.9rem; }
  section > p { text-align:center; font-family:"Cormorant Garamond", serif; font-style:italic; color:var(--soft); font-size:1.05rem; margin-top:.2rem; padding:0 1.5rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(270px, 300px)); justify-content:center; gap:2.75rem 3rem; max-width:900px; margin:0 auto; padding:2.25rem 1.5rem 3rem; }
  .option { display:flex; flex-direction:column; align-items:center; text-decoration:none; color:inherit; }
  .phone { position:relative; width:260px; height:540px; overflow:hidden; border-radius:30px; border:8px solid #1d1b19; background:#fff;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.35); transition:transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s; }
  .phone iframe { position:absolute; top:0; left:0; width:366px; height:735px; border:0; transform:scale(.6776); transform-origin:0 0; pointer-events:none; }
  .option:hover .phone, .option:focus-visible .phone { transform:translateY(-6px); box-shadow:0 40px 70px -30px rgba(0,0,0,.45); }
  .option:focus-visible { outline:none; }
  .meta { text-align:center; margin-top:1.4rem; max-width:290px; }
  .num { font-size:.68rem; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); font-weight:500; }
  .meta h3 { font-family:"Cormorant Garamond", serif; font-weight:500; font-size:1.55rem; margin:.15rem 0 .35rem; }
  .meta > p { font-size:.9rem; color:var(--soft); line-height:1.55; }
  .open { display:inline-block; margin-top:1rem; font-size:.7rem; letter-spacing:.24em; text-transform:uppercase; font-weight:400; border-bottom:1px solid var(--gold); padding-bottom:.2rem; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Nikah · 3 January 2027</p>
  <h1>Suhail &amp; Mubashira</h1>
</header>

<section>
  <h2>The invitations</h2>
  <div class="grid">
    <a class="option" href="suhail/">
      <div class="phone"><iframe src="suhail/#open" title="Suhail's invitation preview" loading="lazy" tabindex="-1"></iframe></div>
      <div class="meta"><p class="num">From Suhail's family · Final</p><h3>Suhail's invitation</h3><span class="open">Open invitation</span></div>
    </a>
    <a class="option" href="mubashira/">
      <div class="phone"><iframe src="mubashira/#open" title="Mubashira's invitation preview" loading="lazy" tabindex="-1"></iframe></div>
      <div class="meta"><p class="num">From Mubashira's family · Final</p><h3>Mubashira's invitation</h3><span class="open">Open invitation</span></div>
    </a>
  </div>
</section>

</body>
</html>
